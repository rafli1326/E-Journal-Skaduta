<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>E-Journal • SMKN 2 Tanjung</title>
    
    <!-- PWA & iOS Meta Tags -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#EA580C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="E-Journal" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="icon" type="image/png" href="./favicon.png" />
  </head>
  <body class="bg-[#F8FAFC] text-[#0F172A] antialiased">
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
    <script>
      // Bersihkan cache Service Worker lama agar tidak menyajikan script usang
      if ('caches' in window) {
        caches.keys().then((keys) => {
          keys.forEach((key) => {
            if (key !== 'ejournal-skaduta-v5') {
              caches.delete(key);
            }
          });
        }).catch(() => {});
      }

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
            .then((reg) => {
              reg.update().catch(() => {});
            })
            .catch(() => {});
        });
      }
    </script>
  </body>
</html>
