<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>E-Journal • SMKN 2 Tanjung</title>
    
    <!-- PWA & iOS Meta Tags -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#EA580C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="E-Journal" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="icon" type="image/png" href="./favicon.png" />

    <!-- Sembunyikan badge bawaan Netlify -->
    <style>
      [data-netlify-badge], 
      .netlify-badge, 
      div[style*="position: fixed"][style*="bottom:"], 
      a[href*="netlify.com"][style*="position: fixed"],
      iframe[src*="netlify"] {
        display: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
      }
    </style>
  </head>
  <body class="bg-[#F8FAFC] text-[#0F172A] select-none antialiased">
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
      
      // Script pengaman tambahan untuk menghapus elemen badge netlify jika disuntikkan secara dinamis
      const observer = new MutationObserver(() => {
        document.querySelectorAll('a[href*="netlify.com"], div[id*="netlify"], [data-netlify-badge]').forEach(el => {
          if (el.textContent && el.textContent.toLowerCase().includes('netlify')) {
            el.remove();
          }
        });
      });
      observer.observe(document.documentElement, { childList: true, subtree: true });
    </script>
  </body>
</html>
